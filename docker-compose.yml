services:
  # 1. Cơ sở dữ liệu Microsoft SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: abcnews-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required in .env file}
      - MSSQL_PID=Developer
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD:?DB_PASSWORD is required in .env file}" -C -Q "SELECT 1" ||
        /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD:?DB_PASSWORD is required in .env file}" -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # 2. Khởi tạo Database ABCNews và Schema tự động
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: abcnews-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./schema:/schema
    entrypoint: >
      bash -c "
      echo '>> Đang nạp cấu trúc CSDL ABCNews...'
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P '${DB_PASSWORD:?DB_PASSWORD is required in .env file}' -C -f 65001 -i /schema/ABCNews.sql || /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P '${DB_PASSWORD:?DB_PASSWORD is required in .env file}' -f 65001 -i /schema/ABCNews.sql
      echo '>> Đang nạp dữ liệu mẫu seed data...'
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P '${DB_PASSWORD:?DB_PASSWORD is required in .env file}' -C -f 65001 -i /schema/seed_data.sql || /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P '${DB_PASSWORD:?DB_PASSWORD is required in .env file}' -f 65001 -i /schema/seed_data.sql
      echo '>> Hoàn tất nạp CSDL ABCNews!'
      "
    restart: "no"

  # 3. Ứng dụng ABCNews Web Application (Tomcat 10.1 + Java 17)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abcnews-app
    ports:
      - "${APP_PORT:-8088}:8080"
    environment:
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_NAME=${DB_NAME:-ABCNews}
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required in .env file}
      - DB_URL=jdbc:sqlserver://sqlserver:1433;databaseName=${DB_NAME:-ABCNews};encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8;
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8088}
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./src/main/webapp/uploads:/usr/local/tomcat/webapps/ROOT/uploads
    restart: unless-stopped

volumes:
  mssql_data:
    driver: local
