services:
  # 1. Cơ sở dữ liệu Microsoft SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: abcnews-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=ABCNews@2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "ABCNews@2026!" -C -Q "SELECT 1" ||
        /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "ABCNews@2026!" -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # 2. Khởi tạo Database ABCNews và Schema tự động
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: abcnews-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./schema/ABCNews.sql:/init.sql
    entrypoint: >
      bash -c "
      echo '>> Đang khởi tạo CSDL ABCNews từ kịch bản schema...'
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'ABCNews@2026!' -C -f 65001 -i /init.sql || /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'ABCNews@2026!' -f 65001 -i /init.sql
      echo '>> Hoàn tất nạp CSDL ABCNews!'
      "
    restart: "no"

  # 3. Ứng dụng ABCNews Web Application (Tomcat 10.1 + Java 17)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abcnews-app
    ports:
      - "8088:8080"
    environment:
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_NAME=ABCNews
      - DB_USER=sa
      - DB_PASSWORD=ABCNews@2026!
      - DB_URL=jdbc:sqlserver://sqlserver:1433;databaseName=ABCNews;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8;
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mssql_data:
    driver: local
