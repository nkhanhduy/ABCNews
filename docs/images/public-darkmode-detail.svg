<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="articleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" fill="url(#articleBg)" rx="16" />

  <!-- Navbar -->
  <rect x="0" y="0" width="1000" height="56" fill="#15803d" rx="16" />
  <g transform="translate(45, 18)">
    <path d="M2 3h16a1 1 0 0 1 1 1v14a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V4a1 1 0 0 1 1-1zm1 2v13a1 1 0 0 0 1 1h13V5H3zm3 2h8v2H6V7zm0 3h8v2H6v-2zm0 3h5v2H6v-2z" fill="#ffffff"/>
  </g>
  <text x="75" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">ABC NEWS</text>
  
  <!-- Nav Links -->
  <text x="210" y="34" fill="#dcfce7" font-family="sans-serif" font-size="12" font-weight="600">Trang chủ</text>
  <text x="290" y="34" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Công nghệ</text>
  <text x="375" y="34" fill="#dcfce7" font-family="sans-serif" font-size="12">Kinh tế</text>
  <text x="445" y="34" fill="#dcfce7" font-family="sans-serif" font-size="12">Đời sống</text>
  <text x="525" y="34" fill="#dcfce7" font-family="sans-serif" font-size="12">Thể thao</text>

  <!-- Dark Mode Toggle Button (Active Sun Icon) -->
  <circle cx="880" cy="28" r="16" fill="#166534" stroke="#4ade80" stroke-width="1.5" />
  <g transform="translate(872, 20)">
    <circle cx="8" cy="8" r="4" fill="#facc15"/>
    <path d="M8 1v2m0 10v2M2.5 2.5l1.5 1.5m8 8l1.5 1.5M1 8h2m10 0h2M2.5 13.5l1.5-1.5m8-8l1.5-1.5" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <text x="906" y="32" fill="#dcfce7" font-family="sans-serif" font-size="10">Dark Mode ON</text>

  <!-- Main Article Box -->
  <g filter="url(#softShadow)">
    <rect x="50" y="76" width="640" height="475" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />

    <!-- Article Tag -->
    <rect x="75" y="100" width="85" height="22" rx="6" fill="#2563eb" fill-opacity="0.25" />
    <text x="117" y="115" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">CÔNG NGHỆ</text>

    <!-- Article Title -->
    <text x="75" y="152" fill="#f8fafc" font-family="sans-serif" font-size="19" font-weight="800">Trí tuệ Nhân tạo &amp; Xu hướng Chuyển đổi Số Tòa soạn 2026</text>

    <!-- Meta Info Bar -->
    <g transform="translate(75, 172)">
      <!-- Calendar icon -->
      <path d="M0 -9 h12 v11 h-12 z M0 -6 h12 M3 -11 v3 M9 -11 v3" stroke="#94a3b8" stroke-width="1" fill="none"/>
      <text x="16" y="0" fill="#94a3b8" font-family="sans-serif" font-size="11">12/09/2026 14:30</text>

      <!-- Author icon -->
      <path d="M140 -8 a2.5 2.5 0 1 0 0 -5 a2.5 2.5 0 0 0 0 5 z M135 1 c0 -2.5 2 -4 5 -4 s5 1.5 5 4 z" fill="#94a3b8"/>
      <text x="150" y="0" fill="#94a3b8" font-family="sans-serif" font-size="11">Nguyễn Khánh Duy</text>

      <!-- Eye icon -->
      <path d="M280 -4 c3 -4 7 -4 10 0 c-3 4 -7 4 -10 0 z M284 -4 a1 1 0 1 0 2 0 a1 1 0 0 0 -2 0 z" stroke="#94a3b8" stroke-width="1" fill="none"/>
      <text x="296" y="0" fill="#94a3b8" font-family="sans-serif" font-size="11">3,420 lượt xem</text>

      <!-- Reading Time Badge -->
      <rect x="395" y="-12" width="130" height="20" rx="10" fill="#334155" stroke="#475569" stroke-width="1" />
      <circle cx="408" cy="-2" r="5" stroke="#38bdf8" stroke-width="1" fill="none"/>
      <path d="M408 -5 v3 h2" stroke="#38bdf8" stroke-width="1" fill="none"/>
      <text x="466" y="2" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">3 phút đọc (640 từ)</text>
    </g>

    <!-- Social Share Bar (1-Click) -->
    <rect x="75" y="195" width="590" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="95" y="221" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Chia sẻ:</text>
    
    <!-- Share FB -->
    <rect x="155" y="204" width="85" height="24" rx="12" fill="#1d4ed8" />
    <text x="197" y="220" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Facebook</text>

    <!-- Share Twitter/X -->
    <rect x="250" y="204" width="75" height="24" rx="12" fill="#334155" />
    <text x="287" y="220" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Twitter (X)</text>

    <!-- Share Telegram -->
    <rect x="335" y="204" width="85" height="24" rx="12" fill="#0284c7" />
    <text x="377" y="220" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Telegram</text>

    <!-- Copy Link Button (Active Green Toast) -->
    <rect x="525" y="204" width="125" height="24" rx="12" fill="#15803d" />
    <text x="587" y="220" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Đã sao chép liên kết</text>

    <!-- Summary Box -->
    <rect x="75" y="252" width="590" height="48" rx="8" fill="#1e293b" stroke="#2563eb" stroke-width="2" stroke-dasharray="0" />
    <text x="90" y="274" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-style="italic" font-weight="600">Tóm tắt: Cuộc cách mạng AI đang định hình lại phương thức sản xuất tin tức hiện đại,</text>
    <text x="90" y="290" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-style="italic" font-weight="600">giúp tối ưu hóa tốc độ tiếp cận độc giả và cá nhân hóa trải nghiệm đọc báo trực tuyến.</text>

    <!-- Article Content Preview -->
    <text x="75" y="325" fill="#e2e8f0" font-family="sans-serif" font-size="12" line-height="1.6">Hệ thống báo chí số ngày nay đòi hỏi tốc độ xử lý thông tin tính bằng giây và khả năng chịu tải</text>
    <text x="75" y="347" fill="#e2e8f0" font-family="sans-serif" font-size="12">cực lớn trong các khung giờ cao điểm. Việc ứng dụng kiến trúc 3-Tier kết hợp cơ chế Connection</text>
    <text x="75" y="369" fill="#e2e8f0" font-family="sans-serif" font-size="12">Pool tối ưu bằng HikariCP đã đem lại khả năng phản hồi vượt trội...</text>

    <!-- Related Articles Section -->
    <rect x="75" y="405" width="590" height="125" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="95" y="428" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Tin Cùng Chuyên Mục</text>
    <line x1="95" y1="438" x2="645" y2="438" stroke="#334155" stroke-width="0.8" />
    
    <text x="95" y="460" fill="#60a5fa" font-family="sans-serif" font-size="11">• 10 Điểm mới trên Java 17 LTS dành cho Kỹ sư Backend</text>
    <text x="590" y="460" fill="#64748b" font-family="sans-serif" font-size="10">10/09/2026</text>

    <text x="95" y="488" fill="#60a5fa" font-family="sans-serif" font-size="11">• Tối ưu hóa Database với HikariCP Connection Pool</text>
    <text x="590" y="488" fill="#64748b" font-family="sans-serif" font-size="10">08/09/2026</text>

    <text x="95" y="516" fill="#60a5fa" font-family="sans-serif" font-size="11">• So sánh hiệu năng giữa Hibernate ORM và Raw JDBC</text>
    <text x="590" y="516" fill="#64748b" font-family="sans-serif" font-size="10">05/09/2026</text>
  </g>

  <!-- Sidebar (Right) -->
  <g filter="url(#softShadow)">
    <rect x="710" y="76" width="240" height="475" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    
    <!-- Newsletter Box in Sidebar -->
    <rect x="725" y="95" width="210" height="145" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="740" y="120" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Đăng Ký Bản Tin Sớm</text>
    <text x="740" y="138" fill="#94a3b8" font-family="sans-serif" font-size="10">Cập nhật tin nóng mỗi sáng</text>
    <rect x="740" y="152" width="180" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="750" y="171" fill="#64748b" font-family="sans-serif" font-size="10">email_cua_ban@gmail.com</text>
    <rect x="740" y="190" width="180" height="28" rx="6" fill="#15803d" />
    <text x="830" y="208" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">ĐĂNG KÝ NGAY</text>

    <!-- Top Viewed Sidebar -->
    <text x="730" y="272" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Bài Viết Xem Nhiều Nhất</text>
    <circle cx="738" cy="300" r="10" fill="#ef4444" />
    <text x="738" y="304" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">1</text>
    <text x="756" y="303" fill="#cbd5e1" font-family="sans-serif" font-size="10">Thị trường công nghệ tuần qua</text>

    <circle cx="738" cy="335" r="10" fill="#f59e0b" />
    <text x="738" y="339" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">2</text>
    <text x="756" y="338" fill="#cbd5e1" font-family="sans-serif" font-size="10">Khởi nghiệp cùng Trí tuệ AI</text>

    <circle cx="738" cy="370" r="10" fill="#3b82f6" />
    <text x="738" y="374" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">3</text>
    <text x="756" y="373" fill="#cbd5e1" font-family="sans-serif" font-size="10">Bảo mật dữ liệu đám mây 2026</text>
  </g>
</svg>
