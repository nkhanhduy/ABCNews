<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="adminBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="editorShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="url(#adminBg)" rx="16" />

  <!-- Window Header -->
  <rect x="0" y="0" width="1000" height="46" fill="#1e293b" rx="16" />
  <circle cx="28" cy="23" r="6" fill="#ef4444" />
  <circle cx="48" cy="23" r="6" fill="#f59e0b" />
  <circle cx="68" cy="23" r="6" fill="#10b981" />
  <text x="500" y="27" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" font-weight="600">ABCNews - Biên Tập Bài Viết Chuyên Nghiệp (CKEditor 5 WYSIWYG)</text>

  <!-- Form Card Container -->
  <g filter="url(#editorShadow)">
    <rect x="50" y="65" width="900" height="460" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />

    <!-- Card Header -->
    <text x="80" y="100" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">✍️ Soạn Thảo &amp; Đăng Tải Tin Tức</text>
    <text x="80" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11">Phóng viên &amp; Biên tập viên: Nguyễn Khánh Duy</text>

    <!-- Form Row 1: Tiêu đề & Chuyên mục -->
    <!-- Input Tiêu đề -->
    <text x="80" y="152" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Tiêu đề bài viết (*)</text>
    <rect x="80" y="160" width="540" height="34" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="95" y="182" fill="#f8fafc" font-family="sans-serif" font-size="12">Kỷ Nguyên Trí Tuệ Nhân Tạo &amp; Tương Lai Ngành Truyền Thông Số</text>

    <!-- Input Chuyên mục -->
    <text x="645" y="152" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Chuyên mục (*)</text>
    <rect x="645" y="160" width="275" height="34" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="660" y="182" fill="#f8fafc" font-family="sans-serif" font-size="12">Công nghệ (TECH) ▼</text>

    <!-- Form Row 2: Tóm tắt -->
    <text x="80" y="214" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Đoạn tóm tắt (Sapo)</text>
    <rect x="80" y="222" width="840" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="95" y="244" fill="#94a3b8" font-family="sans-serif" font-size="11">Bài phân tích chuyên sâu về cách các tòa soạn báo hàng đầu thế giới đang tái cơ cấu mô hình tác nghiệp...</text>

    <!-- CKEDITOR 5 CONTAINER -->
    <text x="80" y="280" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">🎨 Nội dung bài viết (Bộ soạn thảo WYSIWYG CKEditor 5)</text>
    
    <!-- CKEditor Toolbar -->
    <rect x="80" y="290" width="840" height="38" rx="6" fill="#334155" />
    
    <!-- Toolbar buttons -->
    <g transform="translate(90, 298)">
      <!-- Heading Dropdown -->
      <rect x="0" y="0" width="80" height="22" rx="4" fill="#1e293b" />
      <text x="8" y="15" fill="#f8fafc" font-family="sans-serif" font-size="11">Tiêu đề ▼</text>

      <!-- Separator -->
      <line x1="90" y1="2" x2="90" y2="20" stroke="#475569" stroke-width="1" />

      <!-- Bold -->
      <rect x="100" y="0" width="24" height="22" rx="4" fill="#2563eb" />
      <text x="112" y="16" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">B</text>

      <!-- Italic -->
      <rect x="130" y="0" width="24" height="22" rx="4" fill="#1e293b" />
      <text x="142" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-style="italic" text-anchor="middle">I</text>

      <!-- Underline -->
      <rect x="160" y="0" width="24" height="22" rx="4" fill="#1e293b" />
      <text x="172" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle"><u>U</u></text>

      <!-- Separator -->
      <line x1="195" y1="2" x2="195" y2="20" stroke="#475569" stroke-width="1" />

      <!-- Bulleted List -->
      <rect x="205" y="0" width="28" height="22" rx="4" fill="#1e293b" />
      <text x="219" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">•≡</text>

      <!-- Numbered List -->
      <rect x="240" y="0" width="28" height="22" rx="4" fill="#1e293b" />
      <text x="254" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">1.≡</text>

      <!-- Blockquote -->
      <rect x="275" y="0" width="28" height="22" rx="4" fill="#1e293b" />
      <text x="289" y="17" fill="#cbd5e1" font-family="serif" font-size="14" text-anchor="middle">“</text>

      <!-- Table -->
      <rect x="310" y="0" width="28" height="22" rx="4" fill="#1e293b" />
      <text x="324" y="15" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">⊞</text>

      <!-- Link -->
      <rect x="345" y="0" width="28" height="22" rx="4" fill="#1e293b" />
      <text x="359" y="15" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">🔗</text>

      <!-- Separator -->
      <line x1="385" y1="2" x2="385" y2="20" stroke="#475569" stroke-width="1" />

      <!-- Undo / Redo -->
      <text x="400" y="15" fill="#94a3b8" font-family="sans-serif" font-size="12">↶  ↷</text>

      <!-- Badge CKEditor 5 -->
      <rect x="710" y="1" width="115" height="20" rx="4" fill="#0f172a" stroke="#2563eb" stroke-width="0.8" />
      <text x="767" y="15" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">⚡ CKEditor 5 Ready</text>
    </g>

    <!-- CKEditor Editable Area -->
    <rect x="80" y="328" width="840" height="120" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <g transform="translate(95, 350)">
      <text x="0" y="0" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">1. Tác động đa chiều của AI trong sản xuất nội dung</text>
      <text x="0" y="24" fill="#cbd5e1" font-family="sans-serif" font-size="11">Khả năng tự động tổng hợp tin tức, gợi ý từ khóa và phân tích xu hướng thị trường đang giúp các phóng viên</text>
      <text x="0" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="11">tiết kiệm đến 40% thời gian biên tập. Hệ thống quản trị ABCNews cung cấp nền tảng biên tập trực quan,</text>
      
      <!-- Inline Quote Mockup -->
      <line x1="0" y1="58" x2="0" y2="82" stroke="#3b82f6" stroke-width="3" />
      <text x="12" y="74" fill="#93c5fd" font-family="sans-serif" font-size="11" font-style="italic">"Công nghệ không thay thế nhà báo, mà nâng cánh cho sự sáng tạo và tính chính xác của thông tin."</text>
    </g>

    <!-- Bottom Action Buttons -->
    <rect x="80" y="465" width="120" height="36" rx="8" fill="#2563eb" />
    <text x="140" y="488" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">💾 Đăng Bài Viết</text>

    <rect x="215" y="465" width="100" height="36" rx="8" fill="#334155" />
    <text x="265" y="488" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">🔄 Làm Mới</text>

    <!-- Checkbox options -->
    <rect x="670" y="475" width="14" height="14" rx="3" fill="#2563eb" />
    <text x="677" y="486" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">✓</text>
    <text x="692" y="486" fill="#cbd5e1" font-family="sans-serif" font-size="11">Hiển thị Trang nhất</text>

    <rect x="815" y="475" width="14" height="14" rx="3" fill="#2563eb" />
    <text x="822" y="486" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">✓</text>
    <text x="837" y="486" fill="#cbd5e1" font-family="sans-serif" font-size="11">Gửi Newsletter</text>
  </g>
</svg>
