<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="560" fill="url(#bgGrad)" rx="16" />

  <!-- Top App Bar -->
  <rect x="0" y="0" width="1000" height="50" fill="#1e293b" rx="16" />
  <circle cx="28" cy="25" r="6" fill="#ef4444" />
  <circle cx="48" cy="25" r="6" fill="#f59e0b" />
  <circle cx="68" cy="25" r="6" fill="#10b981" />
  <rect x="360" y="14" width="280" height="22" rx="6" fill="#334155" />
  <text x="500" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">localhost:8080/ABCNews/admin/dashboard</text>

  <!-- Title & Stats Row -->
  <text x="40" y="90" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Quản Trị Tòa Soạn - ABCNews Admin Dashboard</text>
  <text x="40" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Tổng quan chỉ số hoạt động và phân tích tương tác thời gian thực</text>

  <!-- 4 Mini Stats Cards -->
  <!-- Card 1: Tổng tin tức -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="130" width="210" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="75" cy="170" r="22" fill="#2563eb" fill-opacity="0.2" />
    <g transform="translate(65, 160)">
      <path d="M2 3h16a1 1 0 0 1 1 1v14a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V4a1 1 0 0 1 1-1zm1 2v13a1 1 0 0 0 1 1h13V5H3zm3 2h8v2H6V7zm0 3h8v2H6v-2zm0 3h5v2H6v-2z" fill="#3b82f6"/>
    </g>
    <text x="110" y="158" fill="#94a3b8" font-family="sans-serif" font-size="11">Tổng số tin tức</text>
    <text x="110" y="184" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="700">1,248</text>
  </g>

  <!-- Card 2: Người dùng -->
  <g filter="url(#cardShadow)">
    <rect x="275" y="130" width="210" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="310" cy="170" r="22" fill="#10b981" fill-opacity="0.2" />
    <g transform="translate(300, 160)">
      <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-8 7a8 8 0 0 1 16 0H4z" fill="#10b981"/>
    </g>
    <text x="345" y="158" fill="#94a3b8" font-family="sans-serif" font-size="11">Người dùng &amp; Phóng viên</text>
    <text x="345" y="184" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="700">324</text>
  </g>

  <!-- Card 3: Chuyên mục -->
  <g filter="url(#cardShadow)">
    <rect x="510" y="130" width="210" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="545" cy="170" r="22" fill="#f59e0b" fill-opacity="0.2" />
    <g transform="translate(535, 160)">
      <path d="M19.4 10.4l-7.8-7.8A2 2 0 0 0 10.2 2H4a2 2 0 0 0-2 2v6.2c0 .5.2 1 .6 1.4l7.8 7.8a2 2 0 0 0 2.8 0l6.2-6.2a2 2 0 0 0 0-2.8zM6.5 8a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill="#f59e0b"/>
    </g>
    <text x="580" y="158" fill="#94a3b8" font-family="sans-serif" font-size="11">Chuyên mục tin</text>
    <text x="580" y="184" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="700">8</text>
  </g>

  <!-- Card 4: Newsletter -->
  <g filter="url(#cardShadow)">
    <rect x="745" y="130" width="215" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="780" cy="170" r="22" fill="#ec4899" fill-opacity="0.2" />
    <g transform="translate(770, 160)">
      <path d="M3 4h18a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v.5l9 6 9-6V6H3zm18 3.5l-8.4 5.6a1 1 0 0 1-1.2 0L3 9.5V18h18V9.5z" fill="#ec4899"/>
    </g>
    <text x="815" y="158" fill="#94a3b8" font-family="sans-serif" font-size="11">Email Subscribers</text>
    <text x="815" y="184" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="700">4,890</text>
  </g>

  <!-- Chart Card 1: Line Chart (Left) -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="230" width="530" height="295" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <!-- Header -->
    <text x="65" y="262" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Xu Hướng Lượt Xem Tin Tức (Chart.js Line)</text>
    <rect x="440" y="248" width="105" height="20" rx="10" fill="#2563eb" fill-opacity="0.2" />
    <text x="492" y="262" fill="#60a5fa" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">Top 5 Hot News</text>

    <!-- Grid lines -->
    <line x1="75" y1="300" x2="535" y2="300" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8" />
    <line x1="75" y1="350" x2="535" y2="350" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8" />
    <line x1="75" y1="400" x2="535" y2="400" stroke="#334155" stroke-dasharray="4 4" stroke-width="0.8" />
    <line x1="75" y1="450" x2="535" y2="450" stroke="#334155" stroke-width="1" />

    <!-- Y labels -->
    <text x="65" y="303" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">1.5k</text>
    <text x="65" y="353" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">1.0k</text>
    <text x="65" y="403" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">500</text>
    <text x="65" y="453" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">0</text>

    <!-- Area Gradient Fill -->
    <path d="M 85 430 Q 170 340, 240 310 T 360 360 T 450 285 L 490 290 L 490 450 L 85 450 Z" fill="url(#blueGrad)" />

    <!-- Smooth Line Path -->
    <path d="M 85 430 Q 170 340, 240 310 T 360 360 T 450 285 L 490 290" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" />

    <!-- Points -->
    <circle cx="85" cy="430" r="5" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />
    <circle cx="200" cy="328" r="5" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />
    <circle cx="310" cy="335" r="5" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />
    <circle cx="410" cy="320" r="5" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />
    <circle cx="490" cy="290" r="6" fill="#60a5fa" stroke="#ffffff" stroke-width="2" />

    <!-- Tooltip Box on Top Point -->
    <rect x="430" y="235" width="90" height="30" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
    <text x="475" y="254" fill="#f8fafc" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">1,820 views</text>

    <!-- X labels -->
    <text x="85" y="475" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Tin AI Tech</text>
    <text x="200" y="475" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Kinh tế 2025</text>
    <text x="310" y="475" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Bóng đá SEA</text>
    <text x="410" y="475" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Y tế số</text>
    <text x="490" y="475" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Xe điện</text>
  </g>

  <!-- Chart Card 2: Doughnut Chart (Right) -->
  <g filter="url(#cardShadow)">
    <rect x="590" y="230" width="370" height="295" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="615" y="262" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Cơ Cấu Chuyên Mục Tin Tức (Chart.js Doughnut)</text>

    <!-- Doughnut Segments Center at (710, 375) -->
    <!-- Segment 1: Technology (Blue 38%) -->
    <path d="M 710 305 A 70 70 0 0 1 780 375 L 755 375 A 45 45 0 0 0 710 330 Z" fill="#3b82f6" />
    <!-- Segment 2: Economy (Emerald 26%) -->
    <path d="M 780 375 A 70 70 0 0 1 735 440 L 725 418 A 45 45 0 0 0 755 375 Z" fill="#10b981" />
    <!-- Segment 3: Sports (Amber 18%) -->
    <path d="M 735 440 A 70 70 0 0 1 650 405 L 670 395 A 45 45 0 0 0 725 418 Z" fill="#f59e0b" />
    <!-- Segment 4: Culture & Others (Rose 18%) -->
    <path d="M 650 405 A 70 70 0 0 1 710 305 L 710 330 A 45 45 0 0 0 670 395 Z" fill="#ec4899" />

    <!-- Center Text -->
    <text x="710" y="372" fill="#f8fafc" font-family="sans-serif" font-size="17" font-weight="700" text-anchor="middle">100%</text>
    <text x="710" y="388" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Tỷ lệ tin</text>

    <!-- Legend -->
    <g transform="translate(805, 320)">
      <circle cx="8" cy="8" r="5" fill="#3b82f6" />
      <text x="20" y="12" fill="#cbd5e1" font-family="sans-serif" font-size="11">Công nghệ (38%)</text>

      <circle cx="8" cy="32" r="5" fill="#10b981" />
      <text x="20" y="36" fill="#cbd5e1" font-family="sans-serif" font-size="11">Kinh tế (26%)</text>

      <circle cx="8" cy="56" r="5" fill="#f59e0b" />
      <text x="20" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="11">Thể thao (18%)</text>

      <circle cx="8" cy="80" r="5" fill="#ec4899" />
      <text x="20" y="84" fill="#cbd5e1" font-family="sans-serif" font-size="11">Văn hóa (18%)</text>
    </g>

    <!-- Footer note -->
    <rect x="615" y="475" width="320" height="28" rx="6" fill="#0f172a" />
    <text x="775" y="493" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">Đồng bộ dữ liệu thời gian thực qua RESTful API</text>
  </g>
</svg>
